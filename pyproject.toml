[project]
name = "whygraph"
version = "0.1.0"
description = "FalkorDB-native repository rationale and issue triage"
requires-python = ">=3.12"
dependencies = ["falkordb>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
lite = ["falkordblite>=0.10"]
semantic = ["sentence-transformers>=3,<7"]
mcp = ["mcp>=1.9,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running FalkorDB"]
